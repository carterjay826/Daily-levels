name: Daily Levels

on:
  schedule:
    # 7:30am ET weekdays. 12:30 UTC = 7:30 EST (winter).
    # Change to "30 11 * * 1-5" when daylight saving starts in March.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python daily_levels.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_LEVELS_WEBHOOK }}
          LOG_WEBHOOK_URL: ${{ secrets.BOT_LOGS_WEBHOOK }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
